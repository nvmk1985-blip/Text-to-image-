name: Assemble Text To Image Studio APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Consistent Debug Keystore and Secrets
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          touch .env || true

      - name: Build Debug Mobile APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare Text-To-Image.apk
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/Text-To-Image.apk

      - name: Upload Mobile APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Text-To-Image-APK
          path: release-artifacts/Text-To-Image.apk

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: release-${{ github.run_number }}
          name: "Text To Image Release v1.0.${{ github.run_number }}"
          body: |
            ## Text To Image Studio - Android APK Release
            - Automated Build for commit `${{ github.sha }}`
            - Realistic Human Generation with FLUX.1 AI Engine
            - Master Control Directive & Anti-Deformity Negative Shield
            - Fully customized 10 Filter Categories with Dynamic Option Adders
          files: release-artifacts/Text-To-Image.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
